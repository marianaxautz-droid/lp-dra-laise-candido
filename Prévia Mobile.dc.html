<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">
<style>body{margin:0;background:#DDD0BC}a{color:#6E2030}a:hover{color:#243F52}</style>
</helmet>
<div style="min-height:100vh;display:flex;flex-wrap:wrap;justify-content:center;align-items:flex-start;gap:48px;padding:40px 20px;font-family:'DM Sans',sans-serif;color:#1A120E">
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <span style="font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase">iPhone · 390 × 844</span>
    <div style="box-sizing:border-box;width:414px;height:868px;border-radius:56px;background:#1A120E;padding:12px;box-shadow:0 40px 80px -30px rgba(26,18,14,.5)">
      <div style="position:relative;width:390px;height:844px;border-radius:44px;overflow:hidden;background:#F0E8DF">
        <iframe src="index.html" title="Versão mobile" style="width:390px;height:844px;border:0;display:block"></iframe>
        <div style="position:absolute;top:10px;left:50%;transform:translateX(-50%);width:120px;height:32px;border-radius:20px;background:#1A120E;pointer-events:none"></div>
      </div>
    </div>
  </div>
  <div style="display:flex;flex-direction:column;align-items:center;gap:14px">
    <span style="font-size:13px;font-weight:500;letter-spacing:.1em;text-transform:uppercase">Android · 360 × 780</span>
    <div style="box-sizing:border-box;width:380px;height:800px;border-radius:40px;background:#1A120E;padding:10px;box-shadow:0 40px 80px -30px rgba(26,18,14,.5)">
      <div style="position:relative;width:360px;height:780px;border-radius:32px;overflow:hidden;background:#F0E8DF">
        <iframe src="index.html" title="Versão mobile Android" style="width:360px;height:780px;border:0;display:block"></iframe>
        <div style="position:absolute;top:12px;left:50%;transform:translateX(-50%);width:14px;height:14px;border-radius:50%;background:#1A120E;pointer-events:none"></div>
      </div>
    </div>
  </div>
</div>
</x-dc>
</body>
</html>
